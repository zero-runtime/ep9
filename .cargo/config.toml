# Cargo merges this file into every cargo run below the repo root, third_party/ and spikes/ included.
# So keep it to aliases and the x86-64 [target] rustflags below: no [build] table, no other flag.
# The x86-64 rustflags are the handler alignment of H15:39 (M10-PRE-ALIGN-FORM): every function that
# LLVM compiles starts on a 64-byte line (not naked_asm! functions or compiler_builtins). They change
# code placement only, never behavior. Stable Rust 1.99.1 has no per-function align attribute, so this
# is the only form. Cargo joins and replaces flag sources by its own precedence rules: RUSTFLAGS (or
# CARGO_ENCODED_RUSTFLAGS) in the environment replaces these rustflags, and other sources (for example
# extra rustc arguments) can add flags. So the flag text is not the evidence: `disasm-check --frames`
# reads the built archive and fails when a checked hot handler does not start on a 64-byte line.
[alias]
xtask = "run --package xtask --"

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "llvm-args=-align-all-functions=6"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "llvm-args=-align-all-functions=6"]
